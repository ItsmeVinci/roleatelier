name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            platform: win
          - os: macos-latest
            label: macOS x64 + arm64
            platform: mac
          - os: ubuntu-latest
            label: Linux x64
            platform: linux
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build:app

      - name: Package desktop app
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged app has no local data
        run: npm run verify:package

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for file in release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb; do
            cp "$file" artifacts/
          done
          ls -lah artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roleatelier-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lah artifacts

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum RoleAtelier-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RoleAtelier ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Publish GitHub Package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package contents
        run: npm run build:app

      - name: Verify npm package has no local data
        run: npm run verify:npm

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@itsmevinci/roleatelier@${VERSION}" --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version ${VERSION} is already published; skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
